{% set name = "flake8-builtins" %}
{% set version = "3.2.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: f0c4cee9028711349b7bf18e9a04282a613fd426e56af00bcd0c3bb61ae25481

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - flake8

test:
  requires:
    - python {{ python_min }}
  commands:
    - 'flake8 --version | grep flake8-builtins:'

about:
  home: https://github.com/gforcada/flake8-builtins
  license: GPL-2.0-only
  license_family: GPL2
  license_file: LICENSE
  summary: Check for python builtins being used as variables or parameters.
  dev_url: https://github.com/gforcada/flake8-builtins

extra:
  recipe-maintainers:
    - dopplershift
